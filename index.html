<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NinjaRoninN - Creator Profile</title>
<style>
/* ===== GLOBAL ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: url("background.png") center/cover no-repeat fixed;
  color: white;
  overflow-x: hidden;
}

.overlay {
  background: rgba(10,15,30,0.35);
  min-height: 100vh;
}

/* ===== HERO ===== */
.hero {
  text-align: center;
  padding: 140px 20px 80px 20px;
  background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.55)),
              url("header_banner.png") center/cover no-repeat;
  position: relative;
  overflow: hidden;
}

.hero h1 {
  font-size: 52px;
  margin: 10px 0;
  letter-spacing: 1px;
  text-shadow: 0 5px 25px rgba(0,0,0,0.9);
  transition: 0.5s;
}

.hero h1:hover {
  text-shadow: 0 0 20px #3b82f6, 0 0 40px #60a5fa;
}

.hero p {
  font-size: 24px;
  color: #93c5fd;
  text-shadow: 0 3px 15px rgba(0,0,0,0.7);
}

.avatar-hex {
  width: 180px;
  height: 180px;
  margin: 0 auto 25px;
  clip-path: polygon(25% 6.7%, 75% 6.7%, 100% 50%, 75% 93.3%, 25% 93.3%, 0% 50%);
  overflow: hidden;
  border: 5px solid #3b82f6;
  box-shadow: 0 0 30px #3b82f6;
  transition: transform 0.5s, box-shadow 0.5s;
}

.avatar-hex:hover {
  transform: scale(1.05);
  box-shadow: 0 0 40px #60a5fa, 0 0 60px #3b82f6;
}

.avatar-hex img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== SECTIONS ===== */
.section {
  max-width: 1100px;
  margin: 50px auto;
  text-align: center;
}

.section h2 {
  color: #60a5fa;
  border-left: 6px solid #3b82f6;
  padding-left: 12px;
  margin-bottom: 25px;
  text-shadow: 0 0 10px rgba(0,0,0,0.6);
}

/* ===== CAROUSEL ===== */
.carousel {
  position: relative;
  max-width: 700px;
  margin: 0 auto 20px;
  overflow: hidden;
  border-radius: 16px;
}

.carousel img {
  width: 100%;
  border-radius: 16px;
  display: none;
  transition: transform 0.5s, box-shadow 0.5s;
}

.carousel img.active {
  display: block;
  transform: scale(1);
  box-shadow: 0 0 40px #3b82f6;
}

/* ===== ARROWS ===== */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 38px;
  background: rgba(0,0,0,0.6);
  padding: 14px 18px;
  border-radius: 50%;
  cursor: pointer;
  user-select: none;
  transition: 0.3s;
  z-index: 5;
}

.arrow.left { left: 10px; }
.arrow.right { right: 10px; }

.arrow:hover {
  background: #3b82f6;
  transform: translateY(-50%) scale(1.15);
}

/* Portfolio Button */
.portfolio-link-btn {
  padding: 16px 32px;
  background: linear-gradient(135deg,#3b82f6,#2563eb);
  color: white;
  border-radius: 14px;
  font-weight: bold;
  text-decoration: none;
  transition: transform 0.3s, box-shadow 0.3s;
}

.portfolio-link-btn:hover {
  transform: scale(1.07);
  box-shadow: 0 0 35px #3b82f6;
}

/* ===== GUIDES ===== */
.dropdown {
  display: inline-block;
  position: relative;
}

.dropdown-btn {
  padding: 16px 28px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg,#3b82f6,#2563eb);
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
}

.dropdown-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 0 30px #3b82f6;
}

.dropdown-content {
  display: none;
  position: absolute;
  background: rgba(15,23,42,0.75);
  backdrop-filter: blur(6px);
  border-radius: 12px;
  margin-top: 12px;
  min-width: 200px;
  flex-direction: column;
  z-index: 10;
}

.dropdown-content.show {
  display: flex;
}

.dropdown-content button {
  background: none;
  border: none;
  cursor: pointer;
  margin: 8px 0;
  opacity: 0;
  transform: translateY(-10px);
  transition: opacity 0.5s, transform 0.5s;
}

.dropdown-content.show button {
  opacity: 1;
  transform: translateY(0);
}

.dropdown-content button img {
  width: 180px;
  height: 70px;
  border-radius: 12px;
  transition: transform 0.3s, box-shadow 0.3s;
}

.dropdown-content button img:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px #3b82f6;
}

.sub-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 10px;
  opacity: 0;
  max-height: 0;
  transition: opacity 0.5s, max-height 0.5s;
}

.sub-buttons.active {
  opacity: 1;
  max-height: 500px;
}

/* ===== SOCIAL + WALLET ===== */
.social-support {
  text-align: center;
  margin: 50px auto 40px auto;
}

.social-support a, .social-support button {
  display: inline-block;
  margin: 5px;
  padding: 14px 26px;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(135deg,#3b82f6,#2563eb);
  color: white;
  transition: transform 0.3s, box-shadow 0.3s;
}

.social-support a:hover, .social-support button:hover {
  transform: scale(1.07);
  box-shadow: 0 0 30px #3b82f6;
}

/* WALLET POPUP */
#walletPopup {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0; top: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.75);
}

#walletPopupContent {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  background: rgba(15,23,42,0.95);
  padding: 30px;
  border-radius: 18px;
  text-align: center;
  max-width: 420px;
}

#walletPopupContent input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  margin-bottom: 15px;
  text-align: center;
}

#walletPopupContent button {
  padding: 12px 22px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  color: white;
  background: #3b82f6;
}

#walletPopupContent button:hover { background:#2563eb; }

@media(max-width:768px){
  .hero h1{font-size:38px;}
  .hero p{font-size:20px;}
  .dropdown-content button img,.carousel img{width:140px;height:55px;}
}
</style>
</head>
<body>
<div class="overlay">

<!-- HERO -->
<header class="hero">
  <div class="avatar-hex"><img src="profile.jpg" alt="NFT Avatar"></div>
  <h1>NinjaRoninN</h1>
  <p>Content Creator & Guides</p>
</header>

<!-- PORTFOLIO -->
<section class="section">
  <h2>💼 Portfolio</h2>
  <div class="carousel" id="portfolioCarousel">
    <span class="arrow left" onclick="prevPortfolio()">❮</span>
    <img src="obra1.png" class="active">
    <img src="obra2.png">
    <img src="obra3.png">
    <img src="obra4.png">
    <img src="obra5.png">
    <img src="obra6.png">
    <img src="obra7.png">
    <img src="obra8.png">
    <img src="obra9.png">
    <img src="obra10.png">
    <span class="arrow right" onclick="nextPortfolio()">❯</span>
  </div>
  <a href="https://drive.google.com/drive/folders/1CHXYbOOOUuHB0Pa9hznVHM76bN2YKhmp" target="_blank" class="portfolio-link-btn">Go to Full Portfolio</a>
</section>

<!-- GUIDES -->
<section class="section">
  <h2>📚 Guides</h2>
  <div class="dropdown">
    <button class="dropdown-btn" onclick="toggleDropdown()">Guides ▼</button>
    <div class="dropdown-content" id="guideDropdown">
      <button onclick="toggleSub('mokuSubs')"><img src="button_moku.png"></button>
      <div class="sub-buttons" id="mokuSubs">
        <button><img src="moku_guide1.png"></button>
        <button><img src="moku_guide2.png"></button>
      </div>
      <button onclick="toggleSub('moreSubs')"><img src="button_more.png"></button>
      <div class="sub-buttons" id="moreSubs">
        <button><img src="more_guide1.png"></button>
      </div>
    </div>
  </div>
</section>

<!-- SOCIAL + WALLET -->
<section class="social-support">
  <a href="https://x.com/NinjaRoninN">X</a>
  <a href="https://discord.gg/...">Discord</a>
  <button onclick="showWallet()">Support</button>
</section>

<!-- WALLET POPUP -->
<div id="walletPopup">
  <div id="walletPopupContent">
    <h3>Support the Creator</h3>
    <input type="text" value="0x298e5dd73995fb5f8708ac1c0b4da1c13dbd6dab" readonly>
    <br>
    <button onclick="copyWallet()">Copy Wallet</button>
    <button onclick="closeWallet()" style="background:red;margin-left:10px;">Close</button>
    <p style="font-size:14px;margin-top:10px;">Use this address in your Ronin wallet to send support.</p>
  </div>
</div>

</div>

<script>
/* WALLET */
function showWallet(){ document.getElementById("walletPopup").style.display="block"; }
function closeWallet(){ document.getElementById("walletPopup").style.display="none"; }
function copyWallet(){
  const input = document.querySelector("#walletPopupContent input");
  navigator.clipboard.writeText(input.value).then(()=>alert("Wallet copied!"));
}

/* PORTFOLIO CAROUSEL */
let portfolioIndex=0;
const slides=document.querySelectorAll("#portfolioCarousel img");
function showPortfolioSlide(i){
  slides.forEach(s=>s.classList.remove("active"));
  slides[i].classList.add("active");
}
function nextPortfolio(){ portfolioIndex=(portfolioIndex+1)%slides.length; showPortfolioSlide(portfolioIndex); }
function prevPortfolio(){ portfolioIndex=(portfolioIndex-1+slides.length)%slides.length; showPortfolioSlide(portfolioIndex); }
showPortfolioSlide(portfolioIndex);

/* GUIDES DROPDOWN */
function toggleDropdown(){
  document.getElementById("guideDropdown").classList.toggle("show");
}
function toggleSub(id){
  document.getElementById(id).classList.toggle("active");
}
</script>
</body>
</html>
