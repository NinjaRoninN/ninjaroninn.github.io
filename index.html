<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NinjaRoninN - Creator Profile</title>

<style>
/* ===== GLOBAL ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: url("background.png") center/cover no-repeat fixed;
  color: white;
  overflow-x: hidden;
}

.overlay {
  background: rgba(10, 15, 30, 0.45);
  min-height: 100vh;
}

/* ===== HERO / HEADER ===== */
.hero {
  text-align: center;
  padding: 120px 20px 80px;
  background: 
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)),
    url("header_banner.png") center/cover no-repeat;
}

.hero h1 {
  font-size: 48px;
  margin: 10px 0;
  text-shadow: 0 5px 25px rgba(0,0,0,0.9);
}

.hero p {
  font-size: 22px;
  color: #93c5fd;
}

/* ===== FLOATING HEX AVATAR ===== */
.avatar-hex {
  width: 180px;
  height: 180px;
  margin: 0 auto 25px;
  clip-path: polygon(25% 6.7%, 75% 6.7%, 100% 50%, 75% 93.3%, 25% 93.3%, 0% 50%);
  overflow: hidden;
  border: 4px solid #3b82f6;
  box-shadow: 0 0 35px #3b82f6;
  animation: float 4s ease-in-out infinite;
}

.avatar-hex img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-12px); }
  100% { transform: translateY(0px); }
}

/* ===== SECTIONS ===== */
.section {
  max-width: 1100px;
  margin: 60px auto;
  text-align: center;
  padding: 0 20px;
}

.section h2 {
  font-size: 30px;
  color: #60a5fa;
  margin-bottom: 25px;
}

/* ===== PORTFOLIO CAROUSEL ===== */
.carousel {
  position: relative;
  max-width: 750px;
  height: 420px;
  margin: 0 auto 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.carousel img {
  max-height: 100%;
  width: auto;
  object-fit: contain;
  display: none;
  border-radius: 16px;
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.carousel img.active {
  display: block;
  box-shadow: 0 0 40px rgba(59,130,246,0.6);
}

/* ARROWS */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 34px;
  background: rgba(0,0,0,0.6);
  padding: 12px 18px;
  border-radius: 50%;
  cursor: pointer;
  user-select: none;
  transition: 0.3s;
  z-index: 10;
}

.arrow.left { left: 10px; }
.arrow.right { right: 10px; }

.arrow:hover {
  background: #3b82f6;
  transform: translateY(-50%) scale(1.15);
}

/* ===== DYNAMIC IMAGE BUTTONS ===== */
.img-button {
  position: relative;
  display: inline-block;
  border: none;
  background: none;
  cursor: pointer;
  padding: 0;
  margin: 10px 0;
}

.img-button img {
  width: 200px;
  height: 80px;
  object-fit: contain;
  border-radius: 16px;
  transition: transform 0.3s, filter 0.3s, box-shadow 0.3s;
}

.img-button span {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-weight: bold;
  font-size: 18px;
  letter-spacing: 1px;
  color: white;
  text-shadow: 0 3px 12px rgba(0,0,0,0.9);
  pointer-events: none;
}

.img-button:hover img {
  transform: scale(1.07);
  filter: brightness(1.15);
  box-shadow: 0 0 25px #3b82f6;
}

/* ===== DROPDOWN ===== */
.dropdown-content {
  display: none;
  flex-direction: column;
  align-items: center;
  margin-top: 15px;
}

.dropdown-content.show {
  display: flex;
}

.sub-buttons {
  display: none;
  flex-direction: column;
  margin-top: 10px;
}

.sub-buttons.active {
  display: flex;
}

/* ===== PORTFOLIO LINK BUTTON ===== */
.portfolio-link {
  display: inline-block;
  padding: 14px 30px;
  background: linear-gradient(135deg,#3b82f6,#2563eb);
  border-radius: 14px;
  font-weight: bold;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

.portfolio-link:hover {
  transform: scale(1.07);
  box-shadow: 0 0 30px #3b82f6;
}

/* ===== FOOTER ===== */
footer {
  text-align: center;
  padding: 40px 20px;
  background: rgba(10,15,30,0.85);
  margin-top: 60px;
}

footer h2 {
  color: #60a5fa;
  margin-bottom: 15px;
}

.footer-btn {
  display: inline-block;
  margin: 6px;
  padding: 12px 24px;
  border-radius: 12px;
  background: linear-gradient(135deg,#3b82f6,#2563eb);
  color: white;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
  cursor: pointer;
}

.footer-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 0 25px #3b82f6;
}

/* WALLET POPUP */
#walletPopup {
  display: none;
  position: fixed;
  z-index: 999;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.75);
}

#walletContent {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: rgba(15,23,42,0.95);
  padding: 30px;
  border-radius: 18px;
  text-align: center;
  width: 90%;
  max-width: 400px;
}

#walletContent input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  text-align: center;
  margin-bottom: 15px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .hero h1 { font-size: 34px; }
  .hero p { font-size: 18px; }
  .carousel { height: 260px; }
  .img-button img { width: 170px; height: 70px; }
}
</style>
</head>
<body>
<div class="overlay">

<!-- HEADER -->
<header class="hero">
  <div class="avatar-hex">
    <img src="profile.jpg" alt="Profile">
  </div>
  <h1>NinjaRoninN</h1>
  <p>Content Creator • Guides • Portfolio</p>
</header>

<!-- PORTFOLIO -->
<section class="section">
  <h2>Portfolio</h2>

  <div class="carousel" id="carousel">
    <span class="arrow left" onclick="prevSlide()">❮</span>
    <img src="obra1.png" class="active">
    <img src="obra2.png">
    <img src="obra3.png">
    <img src="obra4.png">
    <img src="obra5.png">
    <img src="obra6.png">
    <img src="obra7.png">
    <img src="obra8.png">
    <img src="obra9.png">
    <img src="obra10.png">
    <span class="arrow right" onclick="nextSlide()">❯</span>
  </div>

  <a class="portfolio-link" target="_blank"
     href="https://drive.google.com/drive/folders/1CHXYbOOOUuHB0Pa9hznVHM76bN2YKhmp">
     View Full Portfolio
  </a>
</section>

<!-- GUIDES -->
<section class="section">
  <h2>Guides</h2>

  <!-- MAIN GUIDES BUTTON -->
  <button class="img-button" onclick="toggleGuides()">
    <img src="button_base.png">
    <span>GUIDES</span>
  </button>

  <div id="guidesMenu" class="dropdown-content">
    <!-- MOKU BUTTON -->
    <button class="img-button" onclick="toggleSub('mokuMenu')">
      <img src="button_base.png">
      <span>MOKU</span>
    </button>

    <div id="mokuMenu" class="sub-buttons">
      <a href="moku_guide1.html" class="img-button">
        <img src="button_base.png">
        <span>Contest Guide</span>
      </a>
      <a href="moku_guide2.html" class="img-button">
        <img src="button_base.png">
        <span>Beginner Guide</span>
      </a>
    </div>

    <!-- MORE COMING SOON -->
    <button class="img-button" onclick="toggleSub('moreMenu')">
      <img src="button_base.png">
      <span>COMING SOON</span>
    </button>

    <div id="moreMenu" class="sub-buttons">
      <div class="img-button">
        <img src="button_base.png">
        <span>Future Guides</span>
      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <h2>NinjaRoninN</h2>
  <a class="footer-btn" href="https://x.com/NinjaRoninN" target="_blank">X</a>
  <a class="footer-btn" href="https://discord.com/users/1091106407832621157" target="_blank">Discord</a>
  <button class="footer-btn" id="supportBtn">Support</button>
</footer>

<!-- WALLET POPUP -->
<div id="walletPopup">
  <div id="walletContent">
    <h3>Support the Creator</h3>
    <input type="text" id="walletAddress"
      value="0x298e5dd73995fb5f8708ac1c0b4da1c13dbd6dab" readonly>
    <br><br>
    <button id="copyBtn">Copy Wallet</button>
    <button id="closeBtn" style="background:red;margin-left:10px;">Close</button>
  </div>
</div>

</div>

<script>
/* ===== CAROUSEL ===== */
let index = 0;
const slides = document.querySelectorAll("#carousel img");

function showSlide(i){
  slides.forEach(s => s.classList.remove("active"));
  slides[i].classList.add("active");
}

function nextSlide(){
  index = (index + 1) % slides.length;
  showSlide(index);
}

function prevSlide(){
  index = (index - 1 + slides.length) % slides.length;
  showSlide(index);
}

/* ===== DROPDOWN GUIDES ===== */
function toggleGuides(){
  document.getElementById("guidesMenu").classList.toggle("show");
}

function toggleSub(id){
  document.getElementById(id).classList.toggle("active");
}

/* ===== WALLET POPUP ===== */
document.addEventListener("DOMContentLoaded", function(){

  const supportBtn = document.getElementById("supportBtn");
  const walletPopup = document.getElementById("walletPopup");
  const closeBtn = document.getElementById("closeBtn");
  const copyBtn = document.getElementById("copyBtn");
  const walletInput = document.getElementById("walletAddress");

  // OPEN POPUP
  supportBtn.addEventListener("click", () => {
    walletPopup.style.display = "block";
  });

  // CLOSE POPUP
  closeBtn.addEventListener("click", () => {
    walletPopup.style.display = "none";
  });

  // COPY WALLET
  copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(walletInput.value)
      .then(() => alert("Wallet copied to clipboard!"))
      .catch(() => alert("Failed to copy wallet."));
  });

  // CLOSE WHEN CLICK OUTSIDE
  walletPopup.addEventListener("click", (e) => {
    if(e.target === walletPopup){
      walletPopup.style.display = "none";
    }
  });

});
</script>
</body>
</html>
