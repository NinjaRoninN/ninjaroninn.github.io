<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NinjaRonin | Web3 Digital Artist</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',sans-serif;background:#0d0d0d;color:#eee}

/* HEADER */
header{
background:linear-gradient(135deg,#ff4081,#1a1a1a);
text-align:center;
padding:3em 1em 2em 1em;
}

.profile-container{
display:flex;
justify-content:center;
margin-bottom:1.5em;
}

.profile-pic{
width:140px;
height:140px;
clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%);
border:4px solid #ff4081;
object-fit:cover;
box-shadow:0 5px 20px rgba(255,64,129,0.6);
transition:0.3s ease;
}

.profile-pic:hover{
transform:scale(1.08);
box-shadow:0 10px 30px rgba(255,64,129,0.9);
}

h1{
font-family:'Orbitron',sans-serif;
font-size:2.5em;
letter-spacing:2px;
margin-bottom:0.5em;
}

nav a{
color:white;
text-decoration:none;
margin:0 1em;
font-weight:bold;
position:relative;
}

nav a::after{
content:'';
position:absolute;
width:0;
height:2px;
background:#ff4081;
left:0;
bottom:-4px;
transition:0.3s;
}

nav a:hover::after{width:100%}

/* SECTIONS */
section{max-width:1000px;margin:3em auto;padding:0 1em}
h2{text-align:center;margin-bottom:1em;font-family:'Orbitron'}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:1em;
}

.gallery img{
width:100%;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.gallery img:hover{
transform:scale(1.05);
box-shadow:0 10px 25px rgba(255,64,129,0.5);
}

/* MODAL */
.modal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
z-index:1000;
}

.modal img{
max-width:90%;
max-height:90%;
border-radius:10px;
}

/* BUTTONS */
.button-container{
display:flex;
gap:1em;
flex-wrap:wrap;
justify-content:center;
margin-top:1em;
}

.button-container a, .button-container span{
padding:0.7em 1.5em;
border-radius:25px;
text-decoration:none;
display:flex;
align-items:center;
gap:0.5em;
font-weight:bold;
color:white;
transition:0.3s;
}

.button-container a:hover{
transform:scale(1.05);
box-shadow:0 5px 15px rgba(255,64,129,0.6);
}

.email{background:#333}
.twitter{background:#1DA1F2}
.discord{background:#7289DA}
.drive{background:#0F9D58}

/* COMMENTS */
.comment-form{
display:flex;
flex-direction:column;
max-width:600px;
margin:auto;
gap:0.5em;
}

.comment-form input,
.comment-form textarea{
padding:0.7em;
border-radius:8px;
border:none;
font-size:1em;
}

.comment-form button{
padding:0.7em;
border:none;
border-radius:25px;
background:#ff4081;
color:white;
font-weight:bold;
cursor:pointer;
}

.comment-list{
margin-top:1em;
display:flex;
flex-direction:column;
gap:0.7em;
}

.comment-item{
background:#222;
padding:0.7em;
border-radius:10px;
}

/* FOOTER */
footer{
background:#111;
color:#888;
text-align:center;
padding:1.5em;
margin-top:3em;
}
</style>
</head>

<body>

<header>

<div class="profile-container">
<img src="profile.jpg" alt="NFT Avatar" class="profile-pic">
</div>

<h1>NinjaRonin</h1>

<nav>
<a href="#about">About</a>
<a href="#gallery">Gallery</a>
<a href="#contact">Contact</a>
<a href="#comments">Comments</a>
</nav>

</header>

<section id="about">
<h2>About Me</h2>
<p style="text-align:center;max-width:700px;margin:auto">
Digital artist focused on Web3 and NFTs
</p>
</section>

<section id="gallery">
<h2>Gallery</h2>
<div class="gallery">
<img src="obra1.png">
<img src="obra2.png">
<img src="obra3.png">
<img src="obra4.png">
<img src="obra5.png">
<img src="obra6.png">
<img src="obra7.png">
<img src="obra8.png">
<img src="obra9.png">
<img src="obra10.jpg">
</div>
</section>

<section id="contact">
<h2>Contact</h2>
<div class="button-container">
<a href="mailto:dktattoost@gmail.com" class="email"><i class="fa-solid fa-envelope"></i>Email</a>
<a href="https://twitter.com/NinjaRoninN" target="_blank" class="twitter"><i class="fa-brands fa-twitter"></i>@NinjaRoninN</a>
<a href="https://discord.com/users/1091106407832621157" target="_blank" class="discord">
  <i class="fa-brands fa-discord"></i> @ninja_ronin
</a>
<a href="https://drive.google.com/drive/folders/1CHXYbOOOUuHB0Pa9hznVHM76bN2YKhmp" target="_blank" class="drive"><i class="fa-brands fa-google-drive"></i>See More</a>
</div>
</section>

<section id="comments">
<h2>Comments</h2>
<div class="comment-form">
<input type="text" id="name" placeholder="Your name">
<textarea id="comment" placeholder="Your comment"></textarea>
<button id="submitComment">Submit</button>
</div>
<div class="comment-list"></div>
</section>

<div class="modal" id="modal">
<img src="">
</div>

<footer>
© 2026 NinjaRonin. All rights reserved.
</footer>

<script>
// MODAL
const modal=document.getElementById('modal');
const modalImg=modal.querySelector('img');
document.querySelectorAll('.gallery img').forEach(img=>{
img.onclick=()=>{modal.style.display='flex';modalImg.src=img.src;}
});
modal.onclick=()=>modal.style.display='none';

// COMMENTS
document.getElementById('submitComment').onclick=()=>{
const name=document.getElementById('name').value.trim();
const comment=document.getElementById('comment').value.trim();
if(!name||!comment)return;
const div=document.createElement('div');
div.className='comment-item';
div.innerHTML=`<strong>${name}:</strong><p>${comment}</p>`;
document.querySelector('.comment-list').prepend(div);
document.getElementById('name').value='';
document.getElementById('comment').value='';
};
</script>

</body>
</html>
